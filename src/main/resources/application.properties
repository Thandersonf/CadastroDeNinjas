spring.application.name=CadastroDeNinjas

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Adicione esta linha para evitar o erro de Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
# É recomendável definir o path explicitamente
spring.h2.console.path=/h2-console
# Garante que o console aceite conexões externas se necessário (opcional)
spring.h2.console.settings.web-allow-others=true